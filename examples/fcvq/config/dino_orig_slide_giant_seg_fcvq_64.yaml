# Config for lamofc slide seg FCVQ - 64 embeddings
# Original mIoU from training: 0.627

multi_run:
  1.0:

PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

resolution_transform:
  type: ResolutionTransform
  mode: resize
  size: 518

model:
  type: Dinov2OrigSlideSegFCVQ
  slide_size: [518, 518]
  slide_stride: [259, 259]

  dino_backbone:
    model_size: giant
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: null
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth

  fcvq_codec:
    num_embeddings: 64
    embedding_dim: 50
    num_chunks: 1
    lmbda: 1.0
    ckpt_path: ${PROJECT_ROOT}/weights/FCVQ/DINOv2/seg/epoch_300num_64chunk_1.pth.tar

allow_heads:
  - voc2012_seg_giant_last1
