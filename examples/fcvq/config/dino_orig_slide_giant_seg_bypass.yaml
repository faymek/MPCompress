# Config for lamofc slide seg bypass (no compression) - testing baseline mIoU

multi_run:
  1.0:

PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

resolution_transform:
  type: ResolutionTransform
  mode: resize
  size: 518

model:
  type: mpcompress.models.lamofc.Dinov2OrigSlideSegBypass
  slide_size: [518, 518]
  slide_stride: [259, 259]

  dino_backbone:
    model_size: giant
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: null
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth

allow_heads:
  - imagenet_cls_giant_last1
  - voc2012_seg_giant_last1
