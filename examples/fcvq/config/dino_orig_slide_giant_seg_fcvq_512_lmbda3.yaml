# Config for lamofc slide seg FCVQ - 512 embeddings, lmbda=3
# Original mIoU from training: 0.774

multi_run:
  1.0:

PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

resolution_transform:
  type: ResolutionTransform
  mode: resize
  size: 518

model:
  type: Dinov2OrigSlideSegFCVQ
  slide_size: [518, 518]
  slide_stride: [259, 259]

  dino_backbone:
    model_size: giant
    img_size: 518
    patch_size: 14
    dynamic_size: false
    slot: null
    n_last_blocks: 1
    ckpt_path: ${PROJECT_ROOT}/weights/dinov2/backbone/dinov2_vitg14_pretrain.pth

  fcvq_codec:
    num_embeddings: 512
    embedding_dim: 10
    num_chunks: 1
    lmbda: 3.0
    ckpt_path: ${PROJECT_ROOT}/weights/FCVQ/DINOv2/seg/epoch_300num_512chunk_1_lmbda_3.pth.tar

allow_heads:
  - voc2012_seg_giant_last1
