# 评估指标配置
metrics:
  # 分类指标
  cls_metrics:
    type: TopKAccuracyMetric
    topk: [1, 5]
    
  # VOC2012分割指标
  voc2012_seg_metrics:
    type: MeanIoUMetric
    num_classes: 21
    
  # ADE20K分割指标
  ade20k_seg_metrics:
    type: MeanIoUMetric
    num_classes: 150

# 评估任务配置
eval_tasks:
  # ImageNet分类任务
  uvg_val_rec:
    dataset: uvg_val
    metric: cls_metrics
    description: "UVG视频数据集评估(验证集)"

  tumtraf_val_rec:
    dataset: tumtraf_val
    metric: cls_metrics
    description: "TUMTraf视频数据集评估(验证集)"

  imagenet_sel100_cls:
    dataset: imagenet_sel100
    metric: cls_metrics
    description: "ImageNet分类任务评估(100张图)"

  imagenet_sel2k_cls:
    dataset: imagenet_sel2k
    metric: cls_metrics
    description: "ImageNet分类任务评估(2000张图)"

  voc2012_sel20_seg:
    dataset: voc2012_sel20
    metric: voc2012_seg_metrics
    description: "VOC2012分割任务评估(20张图)"

  voc2012_val_seg:
    dataset: voc2012_val
    metric: voc2012_seg_metrics
    description: "VOC2012分割任务评估(验证集)"

  ade20k_val_seg:
    dataset: ade20k_val
    metric: ade20k_seg_metrics
    description: "ADE20K分割任务评估(验证集)"

args:
  # 全局评估参数
  real: false  # 是否使用实际压缩
  recon: 2     # 重建层 (0, 1, 2)
  verbose: true
  output_dir: /home/faymek/MPCompress/eval_results
  save_images: true  # 是否保存重建图像
  save_predictions: true  # 是否保存预测结果 
