# 统一的评估配置文件
# 测试时指定使用哪个dataset和哪些head
PROJECT_ROOT: ${oc.env:PROJECT_ROOT}

# 数据集配置
datasets:
  # TUMTraf视频数据集
  tumtraf_val:
    type: MP4VideoFolder
    root: ${PROJECT_ROOT}/data/tumtraf/video/test
    split: ""
    src_type: mp4
    sequences:
      tn1.mp4:
        src_width: 1920
        src_height: 1200
        frame_num: 150
      tn5.mp4:
        src_width: 1920
        src_height: 1200
        frame_num: 150
      ts1.mp4:
        src_width: 1920
        src_height: 1200
        frame_num: 150
      ts5.mp4:
        src_width: 1920
        src_height: 1200
        frame_num: 150
  # UVG视频数据集
  uvg_val:
    type: MP4VideoFolder
    root: ${PROJECT_ROOT}/data/UVG/test
    split: ""
    src_type: mp4
    sequences:
      Beauty.mp4:
        src_width: 1920
        src_height: 1080
        frame_num: 120

# 头部模型配置
heads:

# 评估指标配置
metrics:
  # 分类指标
  cls_metrics:
    type: TopKAccuracyMetric
    topk: [1, 5]
    
  # VOC2012分割指标
  voc2012_seg_metrics:
    type: MeanIoUMetric
    num_classes: 21
    
  # ADE20K分割指标
  ade20k_seg_metrics:
    type: MeanIoUMetric
    num_classes: 150

# 评估任务配置
eval_tasks:
  # ImageNet分类任务
  uvg_val_rec:
    dataset: uvg_val
    metric: cls_metrics
    description: "UVG视频数据集评估(验证集)"

  tumtraf_val_rec:
    dataset: tumtraf_val
    metric: cls_metrics
    description: "TUMTraf视频数据集评估(验证集)"

args:
  # 全局评估参数
  real: false  # 是否使用实际压缩
  recon: 2     # 重建层 (0, 1, 2)
  verbose: true
  output_dir: ${PROJECT_ROOT}/logs/cavc
  save_images: true  # 是否保存重建图像
  save_predictions: true  # 是否保存预测结果 